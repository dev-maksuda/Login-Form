<!DOCTYPE html>

    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-card">
        <div class="avatar-container">
            <div class="avatar-icon">
                <img src="./image/download.jpg" alt="Avatar"/>
            </div>
        </div>

        <h2>FORM REGISTRATION</h2>

        <form id="registrationForm">
            <div class="input_group">
                <label>Full Name</label>
                <input type="text" id="username" class="inputBox" placeholder="Enter your full name">
                <span id="nameError" class="error"></span>
            </div>

            <div class="input_group">
                <label>Email Address</label>
                <input type="email" id="email" class="inputBox" placeholder="Enter your Email">
                <span id="emailError" class="error"></span>
            </div>

            <div class="input_group">
                <label>Password</label>
                <input type="password" id="password" class="inputBox" placeholder="Enter your password">
                <span id="passError" class="error"></span>
            </div>

            <div class="input_group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" class="inputBox" placeholder="Confirm password">
                <span id="cpassError" class="error"></span>
            </div>

            <div class="input_group">
                <label>Gender</label>
                <div class="radio-wrapper">
                    <label><input type="radio" name="gender" value="male"> Male</label>
                    <label><input type="radio" name="gender" value="female"> Female</label>
                </div>
                <span id="genderError" class="error"></span>
            </div>

            <div class="input_group">
                <label>Profile Picture</label>
                <input type="file" id="fileUpload" class="inputBox" accept="image/*">
                <span id="fileError" class="error"></span>
            </div>

            <div class="input_group">
                <label>About Yourself</label>
                <textarea id="bio" class="inputBox" rows="2" placeholder="Write about yourself..."></textarea>
                <span id="bioError" class="error"></span>
            </div>

            <div class="checkbox-wrapper">
                <label><input type="checkbox" id="terms"> I agree to the terms</label>
                <span id="termsError" class="error"></span>
            </div>

            <button type="button" class="btn">SUBMIT</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>


    <script src="./JS/script.js"></script>
</body>
</html>
